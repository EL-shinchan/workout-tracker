<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Iron Log</title>
  <meta name="theme-color" content="#ff7a1a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body class="workout-light-page login-page">
  <div class="grain"></div>
  <main class="login-shell">
    <section class="login-card">
      <p class="eyebrow">Iron Log</p>
      <h1 id="loginTitle">Welcome back</h1>
      <p class="hero-copy" id="loginCopy">Log in with your username and password.</p>

      <div class="login-mode-switch">
        <button type="button" class="button button-primary" id="showLoginButton">Log in</button>
        <button type="button" class="button button-ghost" id="showSignupButton">Create account</button>
      </div>

      <form id="loginForm" class="config-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="loginName" autocomplete="username" placeholder="Eddie" required />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" id="loginPassword" autocomplete="current-password" required />
        </label>

        <label class="field hidden" id="confirmPasswordField">
          <span>Confirm password</span>
          <input type="password" id="confirmPassword" autocomplete="new-password" />
        </label>

        <button type="submit" class="button button-primary" id="submitLoginButton">Enter Iron Log</button>
      </form>

      <div class="form-status" id="loginStatus">Ready.</div>
    </section>
  </main>

  <script src="scripts/shared.js"></script>
  <script src="scripts/login.js"></script>
</body>
</html>
